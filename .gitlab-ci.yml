# Publishes public/ to GitLab Pages on every push to the default branch.
# __SITE_URL__ in the files is replaced with the site's address, so canonical links, the sitemap,
# robots.txt and llms.txt carry absolute URLs. Set a SITE_URL CI/CD variable (e.g.
# https://dachwerk.app, no trailing slash) once a custom domain is attached; until then the
# Pages address GitLab assigns is used.
pages:
  image: alpine:3.20
  stage: deploy
  script:
    - URL="${SITE_URL:-$CI_PAGES_URL}"
    - URL="${URL%/}"
    - TODAY="$(date -u +%Y-%m-%d)"
    - find public -type f \( -name '*.html' -o -name '*.txt' -o -name '*.xml' \) -exec sed -i -e "s#__SITE_URL__#${URL}#g" -e "s#__LASTMOD__#${TODAY}#g" {} +
    - grep -rl "__SITE_URL__" public && exit 1 || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
